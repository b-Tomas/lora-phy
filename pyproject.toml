[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora"
version = "0.1.0"
description = "Modelo de la modulación LoRa (FSCM) basado en Vangelista (2017)"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["jupyter", "pytest", "ruff"]

[tool.setuptools]
packages = ["lora"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I"]  # Orden de los imports
