[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora"
version = "0.1.0"
description = "Modelo de la modulación LoRa (FSCM) basado en Vangelista (2017)"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["jupyter", "pytest", "ruff"]
# 1.x es para la API de libiio 1.x; el lab usa libiio 0.26
sdr = ["pyadi-iio", "pylibiio>=0.25,<1"]

[tool.setuptools]
packages = ["lora"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # Orden de los imports
